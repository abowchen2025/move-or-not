name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web（lint、型別、vitest、build、check-deid）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # CI 沒有關鍵字清單，去識別化比對會自動略過；機密與 .env 兩項照常執行
      - name: check-deid
        working-directory: .
        run: bash scripts/check-deid.sh

  web-e2e:
    name: web（Playwright，API 以 route 模擬）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  api:
    name: api（ruff、pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: api/.python-version
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: pytest（TZ=UTC）
        run: pytest
        env:
          TZ: UTC
      - name: pytest（TZ=America/Los_Angeles，主機時區不同仍正確）
        run: pytest
        env:
          TZ: America/Los_Angeles

  checks-bash:
    name: AC-30 檢查（bash）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-ac30.sh
      # 確認腳本遇到主題字詞時真的會失敗，避免腳本壞掉卻永遠通過
      - name: AC-30 腳本自我測試
        run: |
          printf 'export const probe = "\xe6\x90\xac";\n' > web/src/__ac30_probe.ts
          if bash scripts/check-ac30.sh; then
            echo "AC-30 腳本應該失敗卻通過" >&2
            exit 1
          fi
          rm web/src/__ac30_probe.ts
      # 確認 package-lock.json 只略過 integrity 雜湊值，其餘內容與其他檔案照常比對
      # （關鍵字由兩段字串組成，避免本檔自己命中）
      - name: check-deid 腳本自我測試
        run: |
          kw="$(printf '%s%s' 'zq' 'xvw')"
          list="$RUNNER_TEMP/deid-probe.txt"
          printf '%s\n' "$kw" > "$list"
          export DEID_KEYWORDS_FILE="$list"
          hash="sha512-AB${kw}CD+/=="
          mkdir __deid_probe
          printf '{"integrity": "%s"}\n' "$hash" > __deid_probe/package-lock.json
          bash scripts/check-deid.sh || { echo "lock 檔雜湊內的命中應該略過" >&2; exit 1; }
          printf '{"resolved": "https://example.invalid/%s.tgz"}\n' "$kw" > __deid_probe/package-lock.json
          if bash scripts/check-deid.sh; then echo "lock 檔其他欄位應該命中" >&2; exit 1; fi
          printf '{"integrity": "%s"}\n' "$hash" > __deid_probe/package-lock.json
          printf '{"integrity": "%s"}\n' "$hash" > __deid_probe/other.json
          if bash scripts/check-deid.sh; then echo "略過只適用 package-lock.json" >&2; exit 1; fi
          rm -rf __deid_probe

  checks-powershell:
    name: AC-30 與 check-deid（Windows PowerShell 5.1）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: check-ac30.ps1
        shell: powershell
        run: |
          ./scripts/check-ac30.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: check-deid.ps1
        shell: powershell
        run: |
          ./scripts/check-deid.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: AC-30 腳本自我測試
        shell: powershell
        run: |
          [IO.File]::WriteAllText('web/src/__ac30_probe.ts', "export const probe = '" + [char]0x642C + "';`n")
          ./scripts/check-ac30.ps1
          if ($LASTEXITCODE -eq 0) { Write-Error 'AC-30 腳本應該失敗卻通過'; exit 1 }
          Remove-Item web/src/__ac30_probe.ts
          exit 0
      - name: check-deid.ps1 腳本自我測試
        shell: powershell
        run: |
          $kw = 'zq' + 'xvw'
          $list = Join-Path $env:RUNNER_TEMP 'deid-probe.txt'
          [IO.File]::WriteAllText($list, "$kw`n")
          $env:DEID_KEYWORDS_FILE = $list
          $hash = "sha512-AB${kw}CD+/=="
          New-Item -ItemType Directory __deid_probe | Out-Null
          [IO.File]::WriteAllText("$PWD/__deid_probe/package-lock.json", "{`"integrity`": `"$hash`"}`n")
          ./scripts/check-deid.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error 'lock 檔雜湊內的命中應該略過'; exit 1 }
          [IO.File]::WriteAllText("$PWD/__deid_probe/package-lock.json", "{`"resolved`": `"https://example.invalid/$kw.tgz`"}`n")
          ./scripts/check-deid.ps1
          if ($LASTEXITCODE -eq 0) { Write-Error 'lock 檔其他欄位應該命中'; exit 1 }
          [IO.File]::WriteAllText("$PWD/__deid_probe/package-lock.json", "{`"integrity`": `"$hash`"}`n")
          [IO.File]::WriteAllText("$PWD/__deid_probe/other.json", "{`"integrity`": `"$hash`"}`n")
          ./scripts/check-deid.ps1
          if ($LASTEXITCODE -eq 0) { Write-Error '略過只適用 package-lock.json'; exit 1 }
          Remove-Item -Recurse __deid_probe
          exit 0
